name: Lua syntax check

on:
  pull_request:
    paths:
      - '**/*.lua'
      - '.github/workflows/lua-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-syntax:
    name: Check Lua 5.1 syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
          lua5.1 -v

      - name: Parse all Lua files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' lua_files < <(
            find . -type f -name '*.lua' -not -path './.git/*' -print0
          )

          if (( ${#lua_files[@]} == 0 )); then
            echo '::error::No Lua files found in the repository.'
            exit 1
          fi

          failed=0

          for file in "${lua_files[@]}"; do
            echo "Checking ${file#./}"

            if ! luac5.1 -p "$file"; then
              echo "::error file=${file#./}::Lua syntax error"
              failed=1
            fi
          done

          if (( failed != 0 )); then
            exit 1
          fi

          echo "All ${#lua_files[@]} Lua files passed syntax validation."

      - name: Run Lua test suite
        run: lua5.1 tests/run.lua
